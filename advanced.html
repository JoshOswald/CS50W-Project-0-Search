    <div class="ads-body">

        <h1>Advanced Search</h1>
        <h2>Find pages with</h2>

        <form action="https://google.com/search">

            <div class="ads-row">
                <label class="ads-text">All of these words:</label>
                <div class="ads-input-box">
                    <input class="ads-input" type="text" name="as_q" type="submit">
                </div>
            </div>

            <div class="ads-row">
                <label class="ads-text">This exact word or phrase:</label>
                <div class="ads-input-box">
                    <input class="ads-input" type="text" name="s_epq" type="submit">
                </div>
            </div>

            <div class="ads-row">
                <label class="ads-text">Any of these words:</label>
                <div class="ads-input-box">
                    <input class="ads-input" type="text" name="as_oq" type="submit">
                </div>
            </div>

            <div class="ads-row">
                <label class="ads-text">None of these words:</label>
                <div class="ads-input-box">
                    <input class="ads-input" type="text" name="as_eq" type="submit">
                </div>
            </div>

            <div class="ads-button-box"><button>Advanced Search</button></div>

        </form>

    </div>
