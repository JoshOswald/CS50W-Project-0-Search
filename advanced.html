<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Advanced Search</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="search_bar">

        </div>
        <form action="https://google.com/search">
            Find pages with:<br>
            All these words:
            <input type="text" name="as_q" type="submit"><br>
            This exact word or phrase:
            <input type="text" name="s_epq" type="submit"><br>
            Any of these words:
            <input type="text" name="as_oq" type="submit"><br>
            None of these words:
            <input type="text" name="as_eq" type="submit"><br>
            <button>Google Search</button>
            <button name="btnI" >I'm Feeling Lucky</button>
        </form>
    </body>
</html>
